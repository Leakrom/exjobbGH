<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Skärgårdskrig</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; padding: 20px; font-family: Arial, sans-serif;">
  <h1>Skärgårdskrig</h1>
  <p>Turbaserat hexspel om sjökrig</p>
  
  <div style="margin: 30px 0;">
    <button onclick="goToGame()" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px;">
      Starta spelet
    </button>
  </div>
  
  <script>
    function goToGame() {
      // Try the standard filename first
      fetch('game.html')
        .then(r => {
          if (r.ok) window.location.href = 'game.html';
          else window.location.href = 'simple-test.html';
        })
        .catch(() => window.location.href = 'simple-test.html');
    }
    
    // Auto-redirect after 2 seconds if not clicked
    setTimeout(() => {
      if (document.hidden === false) {
        window.location.href = 'game.html';
      }
    }, 2000);
  </script>
</body>
</html>
